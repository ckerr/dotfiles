# lots of this is from http://blog.plenz.com/2011-07/switching-screen-for-tmux.html

unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a last-window

# status bar
# The separate -bg/-fg options were removed in tmux 2.9 in favour of the
# combined -style options.
set -g status-style bg=yellow,fg=black
set -g status-interval 5
set -g status-left "#[fg=red]#S %H:%M "
set -g status-right "#H: #(cut -d' ' -f1-3 /proc/loadavg)"
set -w -g window-status-current-style bg=red,fg=yellow

# repeated space/backspace toggles windows forward/backwards
bind -r Space next-window
bind -r C-Space next-window
bind -r C-h previous-window
bind -r C-? previous-window


bind | split-window -h
bind - split-window -v

